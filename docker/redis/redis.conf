# =============================================================================
# Redis Configuration - DAU Examination System
# =============================================================================

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (RDB snapshots)
save 900 1
save 300 10
save 60 10000

# Append-only file (AOF) for durability
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"

# Logging
loglevel notice

# Connection
timeout 300
tcp-keepalive 60

# Performance
databases 16
hz 10
