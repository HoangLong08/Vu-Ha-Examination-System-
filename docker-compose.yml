# =============================================================================
# DAU Examination System - Development Docker Compose
# =============================================================================
# Usage:
#   docker compose up -d          # Start all services
#   docker compose down           # Stop all services
#   docker compose logs -f        # View logs
#   docker compose up -d --build  # Rebuild and start
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: dau-exam-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 251005
      POSTGRES_DB: dau_exam
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dau_exam"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dau-exam-network

  # ===========================================================================
  # Redis Cache
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: dau-exam-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dau-exam-network

  # ===========================================================================
  # Backend (NestJS)
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    container_name: dau-exam-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
    volumes:
      - ./backend/src:/app/src:delegated
      - ./backend/prisma:/app/prisma:delegated
      - ./backend/prisma.config.ts:/app/prisma.config.ts:delegated
      - ./backend/nest-cli.json:/app/nest-cli.json:delegated
      - ./backend/tsconfig.json:/app/tsconfig.json:delegated
      - ./backend/tsconfig.build.json:/app/tsconfig.build.json:delegated
      - ./mock-api:/mock-api:delegated
      - backend_node_modules:/app/node_modules
    working_dir: /app
    command: >
      sh -c "npx prisma generate &&
             npx prisma db push --accept-data-loss &&
             (npx ts-node prisma/seed.ts || echo '[seed] bỏ qua') &&
             npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dau-exam-network

  # ===========================================================================
  # Frontend (Next.js)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    container_name: dau-exam-frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend/src:/app/src:delegated
      - ./frontend/public:/app/public:delegated
      - ./frontend/next.config.ts:/app/next.config.ts:delegated
      - ./frontend/tsconfig.json:/app/tsconfig.json:delegated
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs:delegated
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    command: npm run dev
    depends_on:
      - backend
    networks:
      - dau-exam-network

# =============================================================================
# Networks
# =============================================================================
networks:
  dau-exam-network:
    driver: bridge
    name: dau-exam-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    name: dau-exam-postgres-data
  redis_data:
    name: dau-exam-redis-data
  backend_node_modules:
    name: dau-exam-backend-node-modules
  frontend_node_modules:
    name: dau-exam-frontend-node-modules
